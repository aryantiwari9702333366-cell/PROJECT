<!DOCTYPE html>
<html>
<head>
    <title>Exam Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Exam Registration</h1>
        <p>Fill in your details to register for the exam</p>

        <form onsubmit="registerExam(event)">

            <input type="text" id="name" placeholder="Enter Full Name" required>

            <input type="text" id="rollno" placeholder="Enter Roll Number" required>

            <input type="email" id="email" placeholder="Enter Email" required>

            <input type="text" id="course" placeholder="Enter Course" required>

            <input type="text" id="semester" placeholder="Enter Semester" required>

            <select id="exam" required>
                <option value="">Select Exam</option>
                <option value="Mid Term Exam">Mid Term Exam</option>
                <option value="End Semester Exam">End Semester Exam</option>
                <option value="Practical Exam">Practical Exam</option>
            </select>

            <button type="submit">Register Now</button>

        </form>

        <button onclick="location.href='index.html'">
            Back to Home
        </button>

    </div>

    <script>
        function registerExam(event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let rollno = document.getElementById("rollno").value;
            let email = document.getElementById("email").value;
            let course = document.getElementById("course").value;
            let semester = document.getElementById("semester").value;
            let exam = document.getElementById("exam").value;

            if (name && rollno && email && course && semester && exam) {
                alert("Exam Registration Successful!");
                window.location.href = "confirmation.html";
            }
        }
    </script>

</body>
</html>
